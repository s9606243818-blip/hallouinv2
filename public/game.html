<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎮 Game Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
            min-height: 100vh;
            padding: 20px;
        }

        .dashboard {
            max-width: 1800px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 20px;
            grid-template-rows: auto 1fr;
        }

        .header {
            grid-column: 1 / -1;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 3rem;
            margin-bottom: 10px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.3);
        }

        .header .online-count {
            font-size: 1.5rem;
            opacity: 0.9;
        }

        .panel {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 25px;
            overflow-y: auto;
            max-height: calc(100vh - 250px);
        }

        .panel h2 {
            font-size: 1.8rem;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid rgba(255,255,255,0.3);
        }

        /* Игроки */
        .player-card {
            background: rgba(255, 255, 255, 0.15);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 15px;
            transition: transform 0.2s;
        }

        .player-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .player-card.dead {
            background: rgba(239, 68, 68, 0.2);
            border: 2px solid rgba(239, 68, 68, 0.5);
        }

        .player-card.alive {
            background: rgba(34, 197, 94, 0.2);
            border: 2px solid rgba(34, 197, 94, 0.5);
        }

        .player-header {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 15px;
        }

        .player-avatar {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            border: 3px solid rgba(255,255,255,0.5);
            object-fit: cover;
        }

        .player-name {
            font-size: 1.5rem;
            font-weight: bold;
        }

        .player-role {
            font-size: 0.9rem;
            padding: 5px 12px;
            background: rgba(99, 102, 241, 0.6);
            border-radius: 20px;
            margin-left: auto;
        }

        .player-stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            font-size: 0.95rem;
        }

        .stat {
            padding: 10px;
            background: rgba(0,0,0,0.2);
            border-radius: 10px;
            text-align: center;
        }

        .stat-label {
            opacity: 0.8;
            font-size: 0.85rem;
            margin-bottom: 5px;
        }

        .stat-value {
            font-size: 1.4rem;
            font-weight: bold;
        }

        /* Задания */
        .task-card {
            background: rgba(255, 255, 255, 0.15);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 15px;
        }

        .task-header {
            font-size: 1.2rem;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .task-players {
            font-size: 0.95rem;
            opacity: 0.9;
            margin-bottom: 15px;
        }

        .task-timer {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.5rem;
            font-weight: bold;
            padding: 10px;
            background: rgba(0,0,0,0.2);
            border-radius: 10px;
        }

        .task-timer.warning {
            background: rgba(245, 158, 11, 0.3);
            animation: pulse 1s infinite;
        }

        .task-timer.critical {
            background: rgba(239, 68, 68, 0.3);
            animation: pulse 0.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }

        /* События */
        .event {
            background: rgba(255, 255, 255, 0.1);
            border-left: 4px solid rgba(255,255,255,0.5);
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 10px;
            font-size: 0.95rem;
        }

        .event.task {
            border-left-color: #22c55e;
        }

        .event.card {
            border-left-color: #3b82f6;
        }

        .event.admin {
            border-left-color: #8b5cf6;
        }

        .event.join {
            border-left-color: #06b6d4;
        }

        .event-time {
            opacity: 0.6;
            font-size: 0.85rem;
            margin-top: 5px;
        }

        .empty-state {
            text-align: center;
            opacity: 0.5;
            padding: 40px;
            font-size: 1.1rem;
        }
    </style>
</head>
<body>
    <div class="dashboard">
        <div class="header">
            <h1>🎮 GAME DASHBOARD</h1>
            <div class="online-count">👥 Игроков онлайн: <span id="onlineCount">0</span></div>
        </div>

        <div class="panel">
            <h2>👥 Игроки</h2>
            <div id="playersList"></div>
        </div>

        <div class="panel">
            <h2>📋 Активные задания</h2>
            <div id="tasksList"></div>
        </div>

        <div class="panel">
            <h2>📜 События</h2>
            <div id="eventsList"></div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="/js/dashboard.js"></script>
</body>
</html>
